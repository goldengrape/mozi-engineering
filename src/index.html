<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>造物之理·互动练习</title>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <main class="site-shell">
    <header class="site-header">
      <p class="case-kicker">造物之理</p>
      <h1>互动练习</h1>
      <p>这里运行教材正文中的分支练习。案例不会预先告诉你应该使用哪一种方法。</p>
    </header>
    <section aria-labelledby="chapter-practice-heading">
      <h2 id="chapter-practice-heading">逐章练习</h2>
      <ul class="case-list">
        {{CHAPTER_CASE_LIST}}
      </ul>
    </section>
    <section aria-labelledby="mixed-practice-heading">
      <h2 id="mixed-practice-heading">混合迁移练习</h2>
      <p>这些案例不预先告诉你应使用哪一篇。先看症状和证据，再决定下一步动作。</p>
      <ul class="case-list">
        {{MIXED_CASE_LIST}}
      </ul>
    </section>
  </main>
</body>
</html>
