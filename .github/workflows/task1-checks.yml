name: Project checks

on:
  push:
    branches:
      - "feat/rmd-task-*"
    paths:
      - "package.json"
      - "package-lock.json"
      - "content/cases/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/task1-checks.yml"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "content/cases/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/task1-checks.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run project checks
        run: npm run check

      - name: Validate primary case
        run: npm run check:case

      - name: Browser smoke
        shell: bash
        run: |
          npm run serve > /tmp/mozi-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 0.2
          done

          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome_bin" ]; then
            echo "No Chrome/Chromium binary found on runner" >&2
            exit 1
          fi

          "$chrome_bin"             --headless             --no-sandbox             --disable-gpu             --virtual-time-budget=3000             --dump-dom             http://127.0.0.1:4173/cases/jieti-water-001/             > /tmp/mozi-dom.html

          grep -q "1000 m³" /tmp/mozi-dom.html
          grep -q "先查主表究竟把哪些用水算在一起" /tmp/mozi-dom.html
          grep -q "先按“楼内漏水 180 m³”处理" /tmp/mozi-dom.html
