name: Project checks

on:
  push:
    branches:
      - "feat/rmd-task-*"
    paths:
      - "package.json"
      - "package-lock.json"
      - "content/cases/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/task1-checks.yml"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "content/cases/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/task1-checks.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run project checks
        run: npm run check

      - name: Validate primary case
        run: npm run check:case
