name: Project checks

on:
  push:
    branches:
      - "feat/rmd-task-*"
    paths:
      - "package.json"
      - "package-lock.json"
      - "content/cases/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/task1-checks.yml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "content/cases/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/task1-checks.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run project checks
        run: npm run check

      - name: Validate primary case
        run: npm run check:case

      - name: Browser smoke
        shell: bash
        run: |
          npm run serve > /tmp/mozi-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 0.2
          done

          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome_bin" ]; then
            echo "No Chrome/Chromium binary found on runner" >&2
            exit 1
          fi

          "$chrome_bin"             --headless             --no-sandbox             --disable-gpu             --virtual-time-budget=3000             --dump-dom             http://127.0.0.1:4173/cases/jieti-water-001/             > /tmp/mozi-dom.html

          grep -q "1000 m³" /tmp/mozi-dom.html
          grep -q "先查主表究竟把哪些用水算在一起" /tmp/mozi-dom.html
          grep -q "先按“楼内漏水 180 m³”处理" /tmp/mozi-dom.html


      - name: Public Pages diagnostics
        shell: bash
        env:
          PUBLIC_BASE: https://goldengrape.github.io/mozi-engineering
        run: |
          set -euo pipefail

          probe() {
            local label="$1"
            local url="$2"
            local output="$3"
            local status

            status="$(curl --silent --show-error --location --output "$output" --write-out "%{http_code}" "$url")"
            echo "$label => $status $url"
            printf "%s" "$status"
          }

          home_status="$(probe home "$PUBLIC_BASE/" /tmp/public-home.html)"
          registry_status="$(probe registry "$PUBLIC_BASE/cases/index.json" /tmp/public-registry.json)"
          dir_status="$(probe case-dir "$PUBLIC_BASE/cases/jieti-water-001/" /tmp/public-case-dir.html)"
          index_status="$(probe case-index "$PUBLIC_BASE/cases/jieti-water-001/index.html" /tmp/public-case-index.html)"
          manifest_status="$(probe manifest "$PUBLIC_BASE/cases/jieti-water-001/manifest.json" /tmp/public-manifest.json)"
          story_status="$(probe story "$PUBLIC_BASE/cases/jieti-water-001/story.json" /tmp/public-story.json)"
          ink_status="$(probe ink "$PUBLIC_BASE/assets/ink.js" /tmp/public-ink.js)"
          player_status="$(probe player "$PUBLIC_BASE/assets/player.js" /tmp/public-player.js)"

          echo "summary: home=$home_status registry=$registry_status dir=$dir_status index=$index_status manifest=$manifest_status story=$story_status ink=$ink_status player=$player_status"

          test "$home_status" = "200"
          test "$registry_status" = "200"
          test "$index_status" = "200"
          test "$manifest_status" = "200"
          test "$story_status" = "200"
          test "$ink_status" = "200"
          test "$player_status" = "200"

          grep -q "造物之理" /tmp/public-home.html
          grep -q "jieti-water-001" /tmp/public-manifest.json

          if grep -E '<script[^>]+src=["'\''']https?://' /tmp/public-case-index.html; then
            echo "Remote script dependency found in public case HTML" >&2
            exit 1
          fi

          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome_bin" ]; then
            echo "No Chrome/Chromium binary found on runner" >&2
            exit 1
          fi

          PUBLIC_CASE_URL="$PUBLIC_BASE/cases/jieti-water-001/index.html"

          "$chrome_bin" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --window-size=1440,1000 \
            --virtual-time-budget=5000 \
            --dump-dom \
            "$PUBLIC_CASE_URL" \
            > /tmp/public-desktop-dom.html

          "$chrome_bin" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --window-size=390,844 \
            --virtual-time-budget=5000 \
            --dump-dom \
            "$PUBLIC_CASE_URL" \
            > /tmp/public-mobile-dom.html

          for dom in /tmp/public-desktop-dom.html /tmp/public-mobile-dom.html; do
            grep -q "1000 m³" "$dom"
            grep -q "先查主表究竟把哪些用水算在一起" "$dom"
            grep -q "先按“楼内漏水 180 m³”处理" "$dom"
          done

          echo "Public Pages explicit-index smoke passed for desktop and 390px mobile viewport."
