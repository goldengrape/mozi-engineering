name: Project checks

on:
  push:
    branches:
      - "feat/rmd-task-*"
    paths:
      - "package.json"
      - "package-lock.json"
      - "content/cases/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/task1-checks.yml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "content/cases/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/task1-checks.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run project checks
        run: npm run check

      - name: Validate primary case
        run: npm run check:case

      - name: Browser smoke
        shell: bash
        run: |
          npm run serve > /tmp/mozi-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 0.2
          done

          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome_bin" ]; then
            echo "No Chrome/Chromium binary found on runner" >&2
            exit 1
          fi

          "$chrome_bin"             --headless             --no-sandbox             --disable-gpu             --virtual-time-budget=3000             --dump-dom             http://127.0.0.1:4173/cases/jieti-water-001/             > /tmp/mozi-dom.html

          grep -q "1000 m³" /tmp/mozi-dom.html
          grep -q "先查主表究竟把哪些用水算在一起" /tmp/mozi-dom.html
          grep -q "先按“楼内漏水 180 m³”处理" /tmp/mozi-dom.html


      - name: Public Pages source diagnostics
        shell: bash
        env:
          PUBLIC_BASE: https://goldengrape.github.io/mozi-engineering
        run: |
          set -euo pipefail

          probe() {
            local label="$1"
            local url="$2"
            local output="$3"
            local meta

            meta="$(curl --silent --show-error --location               --output "$output"               --write-out "%{http_code}|%{url_effective}|%{content_type}"               "$url")"

            echo "$label => $meta" >&2
            printf "%s" "$meta"
          }

          home_meta="$(probe home "$PUBLIC_BASE/" /tmp/public-home.html)"
          index_meta="$(probe root-index "$PUBLIC_BASE/index.html" /tmp/public-root-index.html)"
          css_meta="$(probe css "$PUBLIC_BASE/assets/style.css" /tmp/public-style.css)"
          registry_meta="$(probe registry "$PUBLIC_BASE/cases/index.json" /tmp/public-registry.json)"
          case_meta="$(probe case "$PUBLIC_BASE/cases/jieti-water-001/index.html" /tmp/public-case.html)"

          echo "home_meta=$home_meta"
          echo "index_meta=$index_meta"
          echo "css_meta=$css_meta"
          echo "registry_meta=$registry_meta"
          echo "case_meta=$case_meta"

          echo "--- local/public root hashes ---"
          sha256sum dist/index.html /tmp/public-home.html /tmp/public-root-index.html || true

          if cmp -s dist/index.html /tmp/public-home.html; then
            echo "PUBLIC_HOME_MATCHES_DIST=yes"
          else
            echo "PUBLIC_HOME_MATCHES_DIST=no"
          fi

          if cmp -s dist/index.html /tmp/public-root-index.html; then
            echo "PUBLIC_INDEX_MATCHES_DIST=yes"
          else
            echo "PUBLIC_INDEX_MATCHES_DIST=no"
          fi

          echo "--- public home first 30 lines ---"
          sed -n '1,30p' /tmp/public-home.html
